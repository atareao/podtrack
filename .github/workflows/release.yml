name: Release

# Un tag de release (`vX.Y.Z`, empujado por release-prepare) publica el crate en
# crates.io y abre la GitHub Release con las notas del changelog.
#
# El job `publish` se salta mientras `Cargo.toml` siga diciendo `publish = false`
# (crate placeholder), para no dejar una versión imborrable de "hello world" en
# crates.io. Se enciende solo en cuanto exista algo que merezca publicarse.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-26.04
    outputs:
      publish_crate: ${{ steps.detect.outputs.publish_crate }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect what can be published
        id: detect
        run: |
          if grep -qE '^publish[[:space:]]*=[[:space:]]*false' Cargo.toml; then
            echo "publish_crate=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml todavia dice 'publish = false' (crate placeholder): se salta crates.io."
          else
            echo "publish_crate=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish crate (crates.io)
    needs: preflight
    if: needs.preflight.outputs.publish_crate == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  release:
    name: GitHub Release
    needs: preflight
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Build release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
